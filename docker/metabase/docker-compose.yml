services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: SUA-SENHA
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: America/Sao_Paulo

    volumes:
      - metabase_data:/metabase-data

    networks:
      - backend

volumes:
  metabase_data:

networks:
  backend:
    external: true